[project]
name = "fpga-ds-cnn-kws"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pyserial>=3.5",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
    "torch==2.9.1",
    "torchaudio==2.9.1",
    "torchvision==0.24.1",
]


[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
